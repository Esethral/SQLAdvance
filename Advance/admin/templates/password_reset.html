<!DOCTYPE html>
<html lang="en">
  <head>
    <style>table {font-size: 14px; align: center; background-color: #ffffff; } 
           th { font-size:14px; background-color: #ffffff; } 
           td { font-size:14px; background-color: #ffffff; }
    </style>
    <meta charset="UTF-8" />
    <title>SQL Advance</title>
  </head>
  <body>

      <p align="center">
      <img src="{{url_for('static',filename='sqlx.jpg')}}">
      </p>
		
      <p align="center"><b>Password Reset Request</b></p>
      <hr align="center" width="20%">
      <p />

      <form action="#" method="post">
      <table align="center">
      <thead><tr><th align="center" colspan="2">Complete All Fields:</th></tr></thead>
      <tr><td><br /></td></tr>

      <tr>
      <td>Select Unit:</td>
      <td>
      <select name="unit_lname">
          {% for unit in units %}
              <option value="{{ unit.unit_lname }}">{{ unit.unit_lname }}</option>
          {% endfor %}
      </select>
      </td>
      </tr>

      <tr>
      <td><label for="user_name">Login Name:</label></td>
      <td><input type="text" name="user_name" /></td>
      </tr>

      <tr>
      <td><label for="staff_name">Full Name:</label></td>
      <td><input type="text" name="staff_name" /></td>
      </tr>

      <tr>
      <td><label for="user_email">Email:</label></td>
      <td><input type="text" name="user_email" /></td>
      </tr>

      <tr>
      <td><label for="user_email">Phone:</label></td>
      <td><input type="text" name="user_phone" /></td>
      </tr>

      <tr><td><br /></td></tr>
      <tr>
      <td align="center" colspan="2"><button type="submit">Submit</button></td>
      </tr>
      </table>

      </form>
  </body>
</html>
