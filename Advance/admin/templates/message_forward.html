<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - My Messages</title>
</head>

  <body>

      <p align="center">SQL Advance - My Messages</p>

      <form action="#" method="post">
      <table style="border: 0px solid black; border-collapse: collapse; width:411px; margin-left: auto; margin-right: auto;">
      <tr><td><br /></td></tr>

      <tr><td>Recipient:
      <select name="receiver" style="font-size: 14px;">
          {% for user in users %}
          <option value="{{ user.user_id }} -- {{ user.fullname  }}">{{ user.fullname }}</option>
          {% endfor %}
      </select>
      </td></tr>

      <tr>
      <td><label for="subject">Subject:&nbsp;&nbsp;&nbsp;&nbsp;</label>
      <input type="text" name="subject" style="font-size: 13px;" value="FWD: {{ note.subject }}"></td>
      </tr>

      <tr><td colspan="2"><label for="body">Message:</label></td></tr>
      <tr><td colspan="2"><textarea name="body" rows="15" cols="100" />
      ---
      >>> {{ note.body }}
      ---
      </textarea></td>
      </tr>

      <tr><td><br /></td></tr>
      <tr>
      <td align="center" colspan="2"><button style="font-size: 13px;" type="submit">Submit</button></td>
      </tr>
      </table>
      </form>

      {% include '_footer.html' %}

  </body>
</html>
