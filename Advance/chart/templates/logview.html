<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - Unit Logs</title>
</head>

  <body>

      <!-- p align="center">
      <img src="{{url_for('static',filename='sqlx.jpg')}}">
      </p -->
		
      <p align="center"><b>SQL Advance - Unit Log</b></p>
      <!-- hr align="center" width="20%" -->

      <div id="logview">
      <table style="border: 0px solid black; border-collapse: collapse; width:999px; margin-left: auto; margin-right: auto;">
      <tbody>
      {% for log in logs %}
      <tr style="border: 1px solid black; border-collapse: collapse;" >
      <td style="border: 1px solid black; border-collapse: collapse;"><b>Unit Name:</b>  <br />{{ log.unit_lname }}</td>
      <td style="border: 1px solid black; border-collapse: collapse;"><b>Entered By:</b> <br />{{ log.staff_name }}</td>
      <td style="border: 1px solid black; border-collapse: collapse;"><b>Note Date:</b>  <br />{{ log.logdate }}</td>
      <td style="border: 1px solid black; border-collapse: collapse;"><b>Subject:</b>    <br />{{ log.subject}}</td>
      <td style="border: 1px solid black; border-collapse: collapse;"><b>Emergency:</b>  <br />{{ log.alert}}</td>
      </tr>
      <tr style="border: 1px solid black; border-collapse: collapse;" >
      <td colspan="5" style="text-align: left; border: 1px solid black; border-collapse: collapse;"><pre>{{ log.lognote}}</pre></td>
      </tr>
      <tr style="border: 0px solid black; border-collapse: collapse;" >
      <td colspan="5" style="border-collapse: collapse;">&nbsp;<br />&nbsp;<br />&nbsp;</td>
      </tr>
      {% endfor %}
      </tbody>
      </table>
      </div>

      <p align="center"><a href="{{ url_for('admin.unitlog') }}"><center><h4>Enter Log Note</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
