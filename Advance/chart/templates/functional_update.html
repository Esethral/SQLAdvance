<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Functional Assessment</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
      <p align="center">Client Functional Assessments for <b>{{ client.fname }} {{ client.lname }}</b> (ID: {{ client_id }})</b></p>

      <table align="center"><tr><td>

      <form action="#" method="post">
      <table align="center">
      
      <tr>
      <td>Select&nbsp;Unit:</td>
      <td>
      <select name="unit_lname">
      {% for unit in units %}
      {% if unit.unit_lname == record.unit_lname %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_lname }}" selected>{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% else %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_unit_lname }}">{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% endif %}
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td><label for="start_date">Effective Date:</label></td>
      <td><input type="date" name="start_date" value="{{ record.start_date }}"  required /></td>
      </tr>

      <tr>
      <td><label for="end_date">Expiration Date:</label></td>
      <td><input type="date" name="end_date" value="{{ record.end_date }}"  required /></td>
      </tr>

      <tr>
        <td>Skill Area:</td>
        <td>
          <select name="skill_area">

            <!-- Selected value -->
            <option value="{{ record.skill_area }}" 
                    title="{{ record.skill_area }}" 
                    selected>
              {{ record.skill_area[:60] }}{% if record.skill_area|length > 60 %}...{% endif %}
            </option>

            <!-- Options list -->
            {% for skill in skills %}
              <option value="{{ skill.skill_area }}" 
                      title="{{ skill.skill_area }}">
                {{ skill.skill_area[:60] }}{% if skill.skill_area|length > 60 %}...{% endif %}
              </option>
            {% endfor %}

          </select>
        </td>
      </tr>

      <tr>
      <td>Skill Level:</td>
      <td>
      <select name="skill_level">
          <option value="{{record.skill_level}}" selected>{{record.skill_level}}</option>
          <option value="Needs Attention">Needs Attention</option>
          <option value="Needs Immediate Attention">Needs Immediate Attention</option>
          <option value="Adequate">Adequate</option>
          <option value="Excellent">Excellent</option>
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>


      <tr><td colspan="2"><label for="skill_text">Comments:</label></td></tr>
      <tr><td colspan="2"><textarea name="skill_text" rows="15" cols="67" />{{ record.skill_text }}</textarea></td>
      </tr>

      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td><input type="hidden" name="client_id" value="{{ client_id }}" /></td></tr>
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td><input type="hidden" name="start_date" value="{{ start_date }}" /></td></tr>
      <tr><td><input type="hidden" name="end_date" value="{{ end_date }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="update">Submit</button></td></tr>

      </table>
      </form>
      
      <form action="#" method="post">
      <table align="center">
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><br /><br /><font color=red>To DELETE this record click here: </font>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="delete">Delete</button></td></tr>
      </table>
      </form>

      </td></tr>
      </table>

      {% include '_footer.html' %}

  </body>
</html>
