<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Master Patient Index</title>
</head>
  <body>

      <!-- p align="center">
      <img src="{{url_for('static',filename='sqlx.jpg')}}">
      </p -->
		
      <p align="center"><b>SQL Advance - Master Patient Index</b></p>
      <hr align="center" width="20%">

      <table align="center">

      <tr><td colspan="4">
      <center>
      <img src="{{ url_for('chart.client_photo', filename=client.client_id ~ '.jpg') }}"
          width="300"
           onerror="this.style.display='none'">
      </center>
      </td></tr>

      <tr>
      <td>Upload New Photo</td>
      <td>
      <form action="{{ url_for('chart.client_photo_upload', client_id=client_id) }}"
            method="POST"
            enctype="multipart/form-data">
          <input type="file" name="file" accept="image/jpeg">
          <button type="submit">Upload</button>
      </form>
      </td>
      </tr>
      </table>

      <form action="#" method="post">
      <table align="center">
      <thead><tr><th align="center" colspan="2">Client MPI Data:</th></tr></thead>
      <tr><td><br /></td></tr>

      <tr>
      <td><label for="fname">First Name:</label></td>
      <td><input type="text" name="fname" value="{{ client.fname }}" size="20" maxlength="255" required /></td>
      </tr>

      <tr>
      <td><label for="lname">Last Name:</label></td>
      <td><input type="text" name="lname" value="{{ client.lname }}" size="20" maxlength="255" required /></td>
      </tr>

      <tr>
      <td><label for="dob">Date of Birth:</label></td>
      <td><input type="text" name="dob" value="{{ client.dob }}"  /></td>
      </tr>

      <tr>
      <td><label for="ssn">Social Security Number:</label></td>
      <td><input type="text" name="ssn" value="{{ client.ssn }}" /></td>
      </tr>

      <tr>
      <td><label for="medicaid">Medicaid Number:</label></td>
      <td><input type="text" name="medicaid" value="{{ client.medicaid }}" /></td>
      </tr>

      <tr><td><br /></td></tr>
      <tr><td><input type="hidden" name="client_id" value="{{ client.client_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="update">Submit</button></td></tr>
      </table>
      </form>
      
      <form action="#" method="post">
      <table align="center">
      <tr><td><input type="hidden" name="client_id" value="{{ client.client_id }}" /></td></tr>
      <tr><td align="center" colspan="2">To Remove This Record Click Delete: <button type="submit" name="action" value="delete">Delete</button></td></tr>
      </table>
      </form>

      {% include '_footer.html' %}

      </form>
  </body>
</html>
