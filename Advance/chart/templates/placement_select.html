<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - Client Placement</title>
</head>

  <body>

      {% if places %}
          {% set client = client.fname ~ " " ~ client.lname %}
          <p style="text-align: center;"><b>Placement History for: </b> {{ client}} </p>
      {% else %}
          <p align="center"><b>SQL Advance - Client Placement</b></p>
          <p style="text-align: center; color: red"><b>No Placement Records found for this client in this date range.</b></p>
      {% endif %}

      <br />

      <form action="#" method="post">
      <table style="width:486px; margin-left: auto; margin-right: auto;">
      <tr>
      <td>Select Record:</td>
      <td>
      <select name="rec_id">
      {% for place in places %}
      <option value={{ place.rec_id }}>[{{ place.rec_id }}] {{ place.unit_lname }} {{ place.start_date}} - {{ place.end_date or '(Current Placement)' }}</option>
      {% endfor %}
      </select>
      </td>
      </tr>
      </table>
      <br />
      <table align="center">
      <tr><td><input type="hidden" name="client_id" value="{{ client_id }}" /></td></tr>
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="modify">Submit</button></td></tr>
      </table>
      </form>

      <p align="center"><a href="{{ url_for('chart.placement') }}"><center><h4>Enter A Placement Record</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
