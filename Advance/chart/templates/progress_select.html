<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - Progress Notes</title>
</head>

  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>

      {% if notes %}
      <form action="#" method="post">
      <table align="center">
      <tr>
      <td>Select Note: 
      <select name="rec_id">
      {% for note in notes %}
      <option value={{ note.rec_id }}>[{{ note.rec_id }}] Note Date: {{ note.notedate}} | Entered By: {{ note.staff_name }}</option>
      {% endfor %}
      </select>
      </td>
      </tr>
      </table>
      
      <table align="center">
      <tr><td><input type="hidden" name="client_id" value="{{ client_id}}" /></td></tr>
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="modify">Submit</button></td></tr>
      </table>
      </form>
      {% else %}
          <p style="text-align: center; color: red"><b>No Progress Notes found for this client in this date range.</b></p>
      {% endif %}

      <p align="center"><a href="{{ url_for('chart.progress_note') }}"><center><h4>Enter A Progress Note</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
