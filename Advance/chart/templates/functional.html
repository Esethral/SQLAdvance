<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Service Plan</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
      <p align="center">Functional Assessment for <b>{{ client.fname }} {{ client.lname }} (ID: {{ client_id }})</b></p>  

      <table align="center"><tr><td>

      <form action="#" method="post">
      <table align="center">

      <tr>
      <td><label for="start_date">Start Date:</label></td>
      <td><input type="date" name="start_date" value="{{ startdate }}"  required /></td>
      </tr>

      <tr>
      <td><label for="end_date">End Date:</label></td>
      <td><input type="date" name="end_date" value=""  required /></td>
      </tr>

      <tr>
      <td>Select&nbsp;Unit:</td>
      <td>
      <select name="unit_lname">
      <option value="{{ place_str }}" {% if place_str == (place_str) %}selected{% endif %}>{{ place_str }}</option>
      {% for unit in units %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_lname }}">{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td>Skill Area:</td>
      <td><select name="skill_area">
      {% for skill in skills %}
          <option value="{{ skill.skill_area }}" title="{{ skill.skill_area }}">
            {{ skill.skill_area[:60] }}{% if skill.skillarea|length > 60 %}...{% endif %}
        </option>
      {% endfor %}
      </select>
      </td>
      </tr>

      <tr>
      <td>Skill Level:</td>
      <td>
      <select name="skill_level">
          <option value="Needs Attention">Needs Attention</option>
          <option value="Needs Immediate Attention">Needs Immediate Attention</option>
          <option value="Adequate">Adequate</option>
          <option value="Excellent">Excellent</option>
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      </table>

      <table align="center">

      <tr><td colspan="2"><label for="skill_text">Identify Client Barriers And Strengths In This Skill Area:</label></td></tr>
      <tr><td colspan="2"><textarea name="skill_text" rows="6" cols="67" /></textarea></td>
      </tr>
      </td></tr>

      </table>

      <table align="center">
      <tr><td><input type="hidden" name="client_id" value="{{ client_id }}" /></td></tr>
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="insert">Submit</button></td></tr>
      </table>

      </td></tr>
      </table>

      </form>

      {% include '_footer.html' %}

  </body>
</html>
