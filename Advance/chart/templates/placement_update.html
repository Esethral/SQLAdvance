<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Placement</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
      <p align="center">Client Placement for <b>{{ client.fname }} {{ client.lname }}</b> (ID: {{ client.client_id }})</b></p>

      <table align="center"><tr><td>

      <form action="#" method="post">
      <table align="center">
      
      <!-- tr>
      <td>Current Unit:</td>
      <td>{{ place.unit_lname }}</td>
      </tr -->

      <tr>
      <td>Admitting&nbsp;Unit:</td>
      <td>
      <select name="unit_lname">
      {% for unit in units %}
      {% if unit.unit_lname == place.unit_lname %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_lname }}" selected>{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% else %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_lname }}">{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% endif %}
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td><label for="start_date">Admission:</label></td>
      <td><input type="date" name="start_date" value="{{ place.start_date }}"  required /></td>
      </tr>

      <tr>
      <td><label for="end_date">Discharge:</label></td>
      <td><input type="date" name="end_date" value="{{ place.end_date }}"  /></td>
      </tr>

      </table>

      <table align="center">
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td><input type="hidden" name="client_id" value="{{ client_id }}" /></td></tr>
      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="update">Submit</button></td></tr>
      </table>

      </form>

      <form action="#" method="post">
      <table align="center">
      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><br /><br /><font color=red>To DELETE this record click here: </font>
      <input type="hidden" name="delete" value="true">
      <button type="submit" name="action" value="delete">Submit</button>
      </td></tr>
      </table>
      </form>

      </td></tr>
      </table>

      {% include '_footer.html' %}

  </body>
</html>
