<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Select Unit</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
		
      <p align="center"><b>Set Search Parameters</b></p>
      <!-- hr align="center" width="20%" -->

      <form action="#" method="post">
      <table align="center">
      <tr>
      <td>Select Unit:</td>
      <td>
      <select name="unit_lname">
      {% for unit in units %}
      <option value="{{ unit.unit_lname }}">[{{ unit.unit_id }}] {{ unit.unit_lname}}</option>
      {% endfor %}
      </select>
      </td>
      </tr>
      <tr><td align="center" colspan="2"><button type="submit">Submit</button></td></tr>
      </table>
      </form>

      {% include '_footer.html' %}

  </body>
</html>
