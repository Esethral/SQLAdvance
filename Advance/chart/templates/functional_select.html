<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - Functional Assessments</title>
</head>

  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>

      {% if records %}
      <form action="#" method="post">
      <table style="width:486px; margin-left: auto; margin-right: auto;">

      <tr>
        <td>Select Functional Assessment for [{{ client_id }}] {{ client.fname }} {{ client.lname }}:</td>
      </tr>
      <tr>
        <td>
          <select name="rec_id" style="width: 400px;">
            {% for record in records %}
              <option value="{{ record.rec_id }}"
                      title="{{ record.skill_area }}">
                [{{ record.rec_id }}]
                {{ record.skill_area[:60] }}{% if record.skill_area|length > 60 %}...{% endif %}
              </option>
            {% endfor %}
          </select>
        </td>
      </tr>

      </table>
      <br />
      <table align="center">
      <tr><td><input type="hidden" name="client_id" value="{{ client_id }}" /></td></tr>
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="modify">Submit</button></td></tr>
      </table>
      </form>
      {% else %}
          <p style="text-align: center; color: red"><b>No Functional Assessments found for this client in this date range.</b></p>
      {% endif %}

      <p align="center"><a href="{{ url_for('chart.functional') }}"><center><h4>Enter A Functional Assessment</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
