<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Progress Notes</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
		
      <p align="center"><b>Set Search Parameters</b></p>
      <!-- hr align="center" width="20%" -->

      <form action="#" method="post">
      <table align="center">

      <tr>
      <td>Select Client:</td>
      <td>
      <select name="client_id">
      {% for client in clients %}
      <option value={{ client.client_id }}>{{ client.client_id }} {{ client.lname}}, {{ client.fname}}</option>
      {% endfor %}
      </select>
      </td>
      </tr>

      <tr>
      <td><label for="start_date">Start Date:</label></td>
      <td><input type="date" name="start_date" value="{{ start_date }}"  required /></td>
      </tr>

      <tr>
      <td><label for="start_date">End Date:</label></td>
      <td><input type="date" name="end_date" value="{{ end_date }}"  required /></td>
      </tr>

      <tr><td align="center" colspan="2"><button type="submit" name="action" value="select">Submit</button></td></tr>
      </table>

      {% include '_footer.html' %}

      </form>
  </body>
</html>
