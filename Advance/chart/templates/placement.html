<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Placement</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
      <p align="center"><b>Client Placement</b></p>

      <table align="center"><tr><td>

      <form action="#" method="post">
      <table align="center">
      <tr>
      <td>Select&nbsp;Client:</td>
      <td>
      <select name="client_id">
      {% for client in clients %}
      <option value="{{ client.client_id }}">{{ client.client_id }} {{ client.lname}}, {{ client.fname}}</option>
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td><label for="start_date">Admission:</label></td>
      <td><input type="date" name="start_date" value="{{ startdate }}"  required /></td>
      </tr>

      <tr>
      <td><label for="end_date">Discharge:</label></td>
      <td><input type="date" name="end_date" value=""  /></td>
      </tr>

      <tr>
      <td>Admitting&nbsp;Unit:</td>
      <td>
      <select name="unit_lname">
      {% for unit in units %}
          <option value="{{unit.unit_id}} -- {{ unit.unit_lname }}">{{unit.unit_id}} -- {{ unit.unit_lname }}</option>
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td><label for="address">Address:</label></td>
      <td><input type="text" name="address" value="" size="40" maxlength="255" /></td>
      </tr>

      <tr>
      <td><label for="airs">AIRS Code:</label></td>
      <td><input type="text" name="airs" value="" size="40" maxlength="255" /></td>
      </tr>

      <tr>
      <td>PC Direct:</td>
      <td>
      <select name="bip">
          <option value=""></option>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td>HUD Funded:</td>
      <td>
      <select name="hud">
          <option value=""></option>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      </table>

      <table align="center">
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit">Submit</button></td></tr>
      </table>

      </td></tr>
      </table>

      {% include '_footer.html' %}

      </form>
  </body>
</html>
