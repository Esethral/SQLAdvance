<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance - Diagnostic Histories</title>
</head>

  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>
      <p align="center">Diagnostic History for: [ {{ client.client_id }} ] {{ client.fname }} {{ client.lname }} </p>

      {% if records %}
      <form action="#" method="post">
      <table style="width:486px; margin-left: auto; margin-right: auto;">
      <tr><td>Select Client Diagnosis:</td></tr>
      <tr><td style="display:block; width: 400px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      <select name="rec_id">
      {% for record in records %}
      <option value={{ record.rec_id }}>[{{ record.rec_id }}] {{ record.dsm5 }}</option>
      {% endfor %}
      </select>
      </td>
      </tr>
      </table>
      <br />
      <table align="center">
      <tr><td><input type="hidden" name="staff_name" value="{{ fullname }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="modify">Submit</button></td></tr>
      </table>
      <input type="hidden" name="client_id" value="{{ client.client_id }}" />
      </form>
      {% else %}
          <p style="text-align: center; color: red"><b>No Diagnostic Records found for this client.</b></p>
      {% endif %}

      <p align="center"><a href="{{ url_for('chart.diagnosis') }}"><center><h4>Enter A Client Diagnosis</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
