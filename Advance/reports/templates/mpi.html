<!DOCTYPE html>
<html lang = "en">
   <head>
   <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
   </head>
   <body>
      
      <div> 
      <!-- h4>SQLAdvance</h4 -->
      {% include '_header.html' %}
      <h4>Master Patient Index (MPI)</h4>
		
      <table align="center">
      <thead>
      <tr>
      <th>ID</th>
      <th>Last Name</th>
      <th>First Name</th>
      <th>DOB</th>
      <th>SSN</th>
      </tr>
      </thead>
      
      <tbody>
      {% for client in clients %}
      <tr>
      <td>{{ client.client_id}}</td>
      <td>{{ client.lname }}</td>
      <td>{{ client.fname }}</td>
      <td>{{ client.dob}}</td>
      <td>{{ client.ssn}}</td>
      </tr>
      {% endfor %}
      </tbody>
      </table>
      <h4><a href = "{{ url_for('chart.client_add') }}">Add Client</a></h4>

      {% include '_footer.html' %}

      </div> 
      
   </body>
</html>
