<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance</title>
</head>

  <body>
		
      <p align="center"><b>Alert Keywords</b></p>

      {% if words %}

      <div id="scant">
      <table style="border: 0px solid black; border-collapse: collapse; width:350px; margin-left: auto; margin-right: auto;">
      <tbody>
      {% for word in words %}
      <tr><td align="left">&nbsp;<b>keyword:</b> {{ word.keyword }} </td></tr>
      {% endfor %}
      </tbody>
      </table>
      </div>

      {% else %}

      <p align="center"><i>No alert keywords found.</i></p>

      {% endif %}

      <p align="center"><a href="{{ url_for('setup.keyword') }}"><center><h4>Add A Keyword</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
