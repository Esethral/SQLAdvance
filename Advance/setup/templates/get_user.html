<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<meta charset="UTF-8" />
<title>SQL Advance - User Accounts</title>
</head>
  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>

      <form action="#" method="post">
      <table align="center">

      <tr>
      <td>Select User:</td>
      <td>
      <select name="user_id">
      {% for user in users %}
      <option value={{ user.user_id }}>{{ user.user_id }} -- Login: {{ user.username}}, Name: {{ user.fullname}}</option>
      {% endfor %}
      </select>
      </td>
      </tr>

      <tr><td align="center" colspan="2"><button type="submit">Submit</button></td></tr>
      </table>

      {% include '_footer.html' %}

      </form>
  </body>
</html>
