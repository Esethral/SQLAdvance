<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<meta charset="UTF-8" />
<title>SQL Advance - Unit Log Entries</title>
</head>
  <body>

      <p align="center"><b>Unit Log Entry</b> (ID: {{ rec_id }})</b></p>

      <table align="center"><tr><td>

      <form action="#" method="post">
      <table align="center">
      
      <tr>
      <td>Select&nbsp;Unit:</td>
      <td>
      <select name="unit_lname">
      {% for unit in units %}
      {% if unit.unit_lname == log.unit_lname %}
          <option value="{{ unit.unit_lname }}" selected>{{ unit.unit_lname }}</option>
      {% else %}
          <option value="{{ unit.unit_lname }}">{{ unit.unit_lname }}</option>
      {% endif %}
      {% endfor %}
      </select>
      </td>
      <td width="50%">&nbsp;</td>
      </tr>

      <tr>
      <td><label for="logdate">Date:</label></td>
      <td><input type="date" name="logdate" value="{{ log.logdate }}" /></td>
      </tr>

      <tr>
      <td><label for="subject">Subject:</label></td>
      <td><input type="text" name="subject" value="{{ log.subject }}" /></td>
      </tr>

      <tr>
      <td><label for="alert">Emergency: </label></td>
      <td><select name="alert" id="alert">
      <option value="No"
        {% if log.alert == "No" %}selected{% endif %}>
        No
      </option>
      <option value="Yes"
        {% if log.alert == "Yes" %}selected{% endif %}>
        Yes
       </option>
       </select>
      </td>
      </tr>

      <!-- 
           Alert=["{{ log.alert }}"]<br>
           Comparison=[{{ log.alert == "Yes" }}]
      -->

      <table align="center">
      <tr><td colspan="2"><label for="lognote">Log Entry:</label></td></tr>
      <tr><td colspan="2"><textarea name="lognote" rows="15" cols="80" />{{ log.lognote }}</textarea></td>
      </tr>
      </table>

      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="modify">Submit</button></td></tr>

      </table>
      </form>
      
      <form action="#" method="post">
      <table align="center">
      <tr><td><input type="hidden" name="rec_id" value="{{ rec_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><br /><br /><font color=red>To DELETE this record click here: </font>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="delete">Delete</button></td></tr>
      </table>
      </form>

      </td></tr>
      </table>

      {% include '_footer.html' %}

  </body>
</html>
