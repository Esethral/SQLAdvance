<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance</title>
</head>

  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>

      {% if units %}
      <form action="#" method="post">
      <table style="width:486px; margin-left: auto; margin-right: auto;">

      <tr>
        <td>Select Unit:</td>
      </tr>
      <tr>
        <td>
          <select name="unit_id" style="width: 500px;">
            {% for unit in units %}
              <option value="{{ unit.unit_id }}">{{ unit.unit_lname }}
              </option>
            {% endfor %}
          </select>
        </td>
      </tr>

      </table>
      <br />
      <table align="center">
      <tr><td><input type="hidden" name="unit_id" value="{{ unit_id }}" /></td></tr>
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="select">Submit</button></td></tr>
      </table>
      </form>
      {% else %}
          <p style="text-align: center; color: red"><b>No Units found in this date range.</b></p>
      {% endif %}

      <p align="center"><a href="{{ url_for('setup.unit') }}"><center><h4>Add A Unit</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
