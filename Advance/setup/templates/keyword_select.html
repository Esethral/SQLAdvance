<!DOCTYPE html>
<html lang="en">
<head>
<meta charset=utf-8" />
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bare.css') }}" />
<style>table {font-size: 14px; align: center; background-color: #ffffff; } 
th { font-size:14px; background-color: #ffffff; } 
td { font-size:14px; background-color: #ffffff; }
</style>
<title>SQL Advance</title>
</head>

  <body>

      <p align="center"><img src="{{url_for('static',filename='sqlx.jpg')}}"></p>

      {% if words %}
      <form action="#" method="post">
      <table style="width:350px; margin-left: auto; margin-right: auto;">

      <tr>
      <td>Select Keyword:</td>
      </tr>
      <tr>
      <td>
      <select name="rec_id" style="width: 500px;">
      {% for word in words %}
      <option value="{{ word.rec_id }}"> [{{ word.rec_id }}] {{ word.keyword }}
      </option>
      {% endfor %}
      </select>
      </td>
      </tr>

      </table>

      <br />

      <table align="center">
      <tr><td align="center" colspan="2"><button type="submit" name="action" value="select">Submit</button></td></tr>
      </table>
      </form>
      {% else %}
          <p style="text-align: center; color: red"><b>No Alert Keywords Found.</b></p>
      {% endif %}

      <p align="center"><a href="{{ url_for('setup.keyword') }}"><center><h4>Enter A New Record</h4></center></a></p>

      {% include '_footer.html' %}

  </body>
</html>
